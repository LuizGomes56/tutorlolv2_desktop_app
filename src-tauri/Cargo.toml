[package]
name = "tutorlolv2_desktop_app"
version = "0.2.0"
description = "Tutorlolv2 desktop app with support to overlay"
repository = "https://github.com/LuizGomes56/tutorlolv2_desktop_app"
edition = "2024"

[lib]
name = "tutorlolv2_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = { version = "2.8.3", default-features = false, features = [
    "http2",
    "rustls-tls",
] }
tauri-plugin-log = "2.10.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
