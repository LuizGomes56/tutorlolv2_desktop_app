[package]
name = "tutorlolv2_desktop_app"
version = "0.1.1"
description = "Tutorlolv2 desktop app with support to overlay"
authors = ["Luiz Gustavo Santana"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.89.0"

[lib]
name = "tutorlolv2_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-http = { version = "2.7.0", default-features = false, features = [
    "http2",
    "rustls-tls",
] }
tauri-plugin-log = "2.9.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
